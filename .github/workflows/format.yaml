name: Check coding style

on: [push]

jobs:
  ruff:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - uses: astral-sh/setup-uv@v6
    - run: uv sync --group lint
    - name: ruff
      run: uv run ruff check .

  style:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - uses: astral-sh/setup-uv@v6
    - run: uv sync --group lint
    - name: autopep8
      run: uv run autopep8 -r --diff --max-line-length 120 SOURCES tests
    - name: flake8
      run: uv run flake8 SOURCES tests
    - name: pydocstyle
      run: uv run pydocstyle

  pyright:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - uses: astral-sh/setup-uv@v6
    - run: uv sync --group lint
    - name: pyright
      run: uv run pyright

  strip-compat:
    # The sources must stay installable on XCP-ng 8.3: verify that the
    # output of strip-python3 (what the RPM installs) compiles with
    # python 2.7 and 3.6. strip-python3 needs python 3.9+ to run (3.12).
    # The 3.x interpreters are installed with pyenv, as GitHub's
    # actions/setup-python has no python 3.6 build for the current
    # runners; python 2.7 is unavailable there as well, so the check
    # runs it through the python:2.7.9-slim docker image (closest to
    # the 2.7.5 shipped with XCP-ng 8.3) via a shell wrapper.
    runs-on: ubuntu-24.04
    env:
      PYTHON27: /usr/local/bin/python2.7
      PYTHON36: /home/runner/.pyenv/versions/3.6.15/bin/python3.6
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python 2.7
      run: |
        sudo apt-get install podman
        podman pull python:2.7.9-slim
        cat >/usr/local/bin/python2.7 <<EOF
        #!/bin/sh
        set -eu
        command -v podman >/dev/null 2>&1 || { echo "error: podman is required but was not found" >&2; exit 1; }
        exec podman run --rm -v "\$(pwd)":\$(pwd) -w "\$(pwd)" python:2.7.9-slim python2.7 "\$@"
        EOF
        chmod 755 /usr/local/bin/python2.7

    - name: Cache pyenv
      id: pyenv-cache
      uses: actions/cache@v4
      with:
        path: ~/.pyenv
        key: pyenv-${{ runner.os }}-3.6.15-3.12.9

    - name: Set up Python 3
      if: steps.pyenv-cache.outputs.cache-hit != 'true'
      uses: LizardByte/actions/actions/setup_python@v2026.1108.210022
      with:
        python-version: |
          3.6.15
          3.12.9
        update-environment: false

    - name: Use cached Python
      if: steps.pyenv-cache.outputs.cache-hit == 'true'
      run: |
        test -x "$HOME/.pyenv/versions/3.6.15/bin/python3" || exit 1
        test -x "$HOME/.pyenv/versions/3.12.9/bin/python3" || exit 1
        echo "$HOME/.pyenv/shims" >> "$GITHUB_PATH"
        echo "$HOME/.pyenv/bin" >> "$GITHUB_PATH"
        sudo update-alternatives --install /usr/bin/python python "$HOME/.pyenv/shims/python" 1
        python --version

    - uses: astral-sh/setup-uv@v6

    - run: uv sync --python "3.12" --group build

    - name: strip-python3 compatibility check
      run: bash scripts/check_stripped_compat.sh all
