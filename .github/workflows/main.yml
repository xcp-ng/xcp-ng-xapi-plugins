name: Run unit tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # XCP-ng 8.3 uses python 3.6, XCP-ng 9.0 uses python 3.12.
        python: ["3.6.15", "3.12.13"]
    steps:
    - name: checkout
      uses: actions/checkout@v6

    # GitHub's actions/setup-python has no python 3.6 build for the
    # current runners, so install the interpreters with pyenv (compiles
    # from source). update-environment is off so it does not create its
    # own virtualenv; uv builds the one the tests run in.
    - name: Set up Python
      uses: LizardByte/actions/actions/setup_python@v2026.1108.210022
      with:
        python-version: ${{ matrix.python }}
        update-environment: false

    - name: Set up uv
      uses: astral-sh/setup-uv@v6

    - name: Install dependencies
      run: uv sync --python "${{ matrix.python }}" --group test

    - name: Run unit tests
      run: uv run pytest
