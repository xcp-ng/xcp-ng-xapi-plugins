[build-system]
requires = ["setuptools >= 75.3.4"]
build-backend = "setuptools.build_meta"

[project]
name = "xcp-ng-xapi-plugins"
version = "1.19.0"
requires-python = ">=3.6"
authors = [{name = "XCP-ng maintainers"}]
maintainers = [{name = "XCP-ng maintainers"}]
description = "Plugins for xen-api installed in XCP-ng"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://xcp-ng.org/"
Repository = "https://github.com/xcp-ng/xcp-ng-xapi-plugins.git"
Issues = "https://github.com/xcp-ng/xcp-ng-xapi-plugins/issues"

[tool.uv]
# This repo is not a distributable python package: the sources are installed
# by the xcp-ng-xapi-plugins RPM from SOURCES/etc/xapi.d/plugins.
# uv only manages the test, lint and build toolchains.
package = false

[dependency-groups]
# Test dependencies, resolved per python version from a single uv.lock:
# python 3.6 (XCP-ng 8.3) and python 3.12 (XCP-ng 9.0).
test = [
    "pytest>=7.0.1",
    "pyfakefs",
    "mock",
]
# Linters and formatter.
lint = [
    "ruff",
    "flake8",
    "autopep8",
    "pydocstyle",
    "pyright",
]
# Packaging helpers. strip-python3 removes type annotations and downgrades
# the syntax to python 2.7 compatible code for what is installed on XCP-ng
# 8.3; it needs to run on python >= 3.9 (broken on newer pythons).
build = [
    "strip-python3 ; python_version >= '3.9'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
log_cli = true
log_cli_level = "info"
log_cli_format = "%(asctime)s %(levelname)s %(message)s"
log_cli_date_format = "%b %d %H:%M:%S"

[tool.ruff]
# The sources must stay compatible with python 3.6 (XCP-ng 8.3);
# ruff cannot express that (its oldest target is py37), so py37 is
# used and the syntax is kept 3.6 compatible by the strip check.
target-version = "py37"
line-length = 120

[tool.ruff.lint]
# E, W: pycodestyle (same ignores as the old [pycodestyle] setup.cfg section)
# F: pyflakes
# I: import sorting
# B: bugbear
select = ["E", "W", "F", "I", "B"]
# W503/W504 are not implemented in ruff, so they stay ignored only in
# the pycodestyle/flake8 configuration (setup.cfg).
ignore = ["E261", "E302", "E305", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["xcpngutils"]

[tool.pyright]
# Type check with the oldest python the sources must support (XCP-ng 8.3).
# Only the shared xcpngutils package is checked for now; the individual
# plugins are not yet typed.
pythonVersion = "3.6"
typeCheckingMode = "basic"
include = ["SOURCES/etc/xapi.d/plugins/xcpngutils"]
extraPaths = ["stubs"]
