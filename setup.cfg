[pycodestyle]
max-line-length=120
ignore=E261,E302,E305,E402,W503

[pydocstyle]
ignore=D100,D101,D102,D103,D104,D105,D106,D107,D203,D210,D212,D401,D403

[flake8]
# Same rules as the [pycodestyle] section above, plus pyflakes (F codes).
max-line-length = 120
ignore = E261,E302,E305,E402,W503
exclude = .venv,.venv-*,.git,__pycache__
